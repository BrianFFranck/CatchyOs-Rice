# Junji Ito: ink black, manga-paper white, one drop of blood.
font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 14
cursor_shape     beam
cursor_blink_interval 0.6
background_opacity 0.94
background_blur  24
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.08
visual_bell_color #8f1d1d

# faint Uzumaki spiral creeping in from the corner
background_image ~/.local/share/junji-ito-rice/term-bg.png
background_image_layout scaled
background_tint 0.0

tab_bar_style    powerline
tab_powerline_style slanted
active_tab_foreground   #070707
active_tab_background   #d9d7d2
inactive_tab_foreground #6e6e6e
inactive_tab_background #101010

foreground #d9d7d2
background #070707
selection_foreground #070707
selection_background #d9d7d2
cursor #d9d7d2
cursor_text_color #070707
url_color #c8c6c1
url_style curly
active_border_color #d9d7d2
inactive_border_color #262626

color0  #101010
color8  #464646
color1  #8f1d1d
color9  #b52a2a
color2  #8a8a8a
color10 #b0b0b0
color3  #a39d8c
color11 #c9c3b2
color4  #6e6e6e
color12 #9a9a9a
color5  #7d6f6f
color13 #a39494
color6  #9aa0a0
color14 #c2c8c8
color7  #c8c6c1
color15 #f2f0eb
